<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f4f8;
    padding:30px;
}

.container{
    width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#0066cc;
}

fieldset{
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
}

legend{
    font-weight:bold;
    color:#0066cc;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input[type=text],
input[type=email],
input[type=tel],
input[type=date],
input[type=number],
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:5px;
    border:1px solid #aaa;
}

textarea{
    resize:none;
}

.gender{
    margin-top:10px;
}

.buttons{
    text-align:center;
}

input[type=submit],
input[type=reset]{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
    font-size:16px;
}

input[type=submit]{
    background:#0066cc;
}

input[type=reset]{
    background:#666;
}

input[type=submit]:hover{
    background:#004d99;
}

input[type=reset]:hover{
    background:#444;
}
</style>

<script>

function validateForm(){

    let name=document.getElementById("name").value.trim();
    let email=document.getElementById("email").value.trim();
    let phone=document.getElementById("phone").value.trim();
    let dob=document.getElementById("dob").value;
    let position=document.getElementById("position").value;
    let exp=document.getElementById("exp").value;
    let salary=document.getElementById("salary").value;
    let resume=document.getElementById("resume").value;
    let about=document.getElementById("about").value.trim();

    let gender=document.getElementsByName("gender");
    let genderSelected=false;

    for(let i=0;i<gender.length;i++){
        if(gender[i].checked){
            genderSelected=true;
        }
    }

    let namePattern=/^[A-Za-z ]+$/;
    let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    let phonePattern=/^[0-9]{10}$/;

    if(!namePattern.test(name)){
        alert("Enter a valid name.");
        return false;
    }

    if(!emailPattern.test(email)){
        alert("Enter a valid email.");
        return false;
    }

    if(!phonePattern.test(phone)){
        alert("Phone number must contain exactly 10 digits.");
        return false;
    }

    if(dob==""){
        alert("Select your Date of Birth.");
        return false;
    }

    if(!genderSelected){
        alert("Select your gender.");
        return false;
    }

    if(position==""){
        alert("Select a job position.");
        return false;
    }

    if(exp<0){
        alert("Experience cannot be negative.");
        return false;
    }

    if(salary<=0){
        alert("Enter a valid expected salary.");
        return false;
    }

    if(resume==""){
        alert("Please upload your resume.");
        return false;
    }

    if(about.length<20){
        alert("Introduction must contain at least 20 characters.");
        return false;
    }

    alert("Job Application Submitted Successfully!");
    return true;
}

</script>

</head>

<body>

<div class="container">

<h2>Online Job Application Form</h2>

<form onsubmit="return validateForm()">

<fieldset>

<legend>Personal Information</legend>

<label>Full Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Phone Number</label>
<input type="tel" id="phone">

<label>Date of Birth</label>
<input type="date" id="dob">

<label>Gender</label>

<div class="gender">
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</div>

</fieldset>

<fieldset>

<legend>Job Details</legend>

<label>Position</label>

<select id="position">
<option value="">--Select Position--</option>
<option>Software Developer</option>
<option>Web Developer</option>
<option>Data Analyst</option>
<option>QA Engineer</option>
</select>

<label>Years of Experience</label>
<input type="number" id="exp">

<label>Expected Salary</label>
<input type="number" id="salary">

</fieldset>

<fieldset>

<legend>Resume</legend>

<label>Upload Resume</label>
<input type="file" id="resume">

<label>Why should we hire you?</label>
<textarea rows="5" id="about"></textarea>

</fieldset>

<div class="buttons">

<input type="submit" value="Apply">

<input type="reset" value="Clear">

</div>

</form>

</div>

</body>
</html>
